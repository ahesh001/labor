name: Bug report
description: Report a problem with LaborTracker.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Use fictional delivery examples. Remove customer details, account IDs, credentials, and screenshots containing private information. Report security issues privately using the repository's Security Policy.
  - type: textarea
    id: steps
    attributes:
      label: What happened and how can we reproduce it?
      description: Include the page, steps, and any error message with private details removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: workspace
    attributes:
      label: Workspace
      options:
        - Signed-in staff
        - Signed-in customer
        - Demo
        - Guest or sign-in page
        - Local development
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and version
      description: Include the browser and device and, if available, the LaborTracker release or commit.
