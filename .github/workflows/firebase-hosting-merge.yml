name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build with Firebase browser configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.LABORTRACKER_FIREBASE_API_KEY }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || { echo 'Missing LABORTRACKER_FIREBASE_API_KEY repository secret'; exit 1; }
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LABORTRACKER_CAB93 }}
          channelId: live
          projectId: labortracker-cab93
